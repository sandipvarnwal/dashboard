<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      background-color: #f8f9fa;
    }
    .table-container {
      max-width: 100%;
      max-height: 80vh;
      overflow: auto;
      border: 1px solid #ccc;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      background: white;
    }
    table {
      border-collapse: separate;
      border-spacing: 0;
      width: 100%;
    }
    td, th {
      border-right: 1px solid #e0e0e0;
      border-bottom: 1px solid #e0e0e0;
      padding: 8px 12px;
      white-space: nowrap;
      font-size: 13px;
    }
    
    /* Sticky Freeze Panes */
    .freeze-row {
      position: sticky;
      z-index: 2;
    }
    .freeze-col {
      position: sticky;
      z-index: 2;
    }
    .freeze-row.freeze-col {
      z-index: 3; /* Top-left intersection cell stays on top */
    }
  </style>
</head>
<body>

  <h2>Client Dashboard</h2>
  <div class="table-container">
    <table id="sheet-table"></table>
  </div>

  <script>
    async function loadDashboard() {
      try {
        const response = await fetch('./data.json');
        const data = await response.json();
        
        const table = document.getElementById('sheet-table');
        const frozenRows = data.meta.frozenRows || 0;
        const frozenCols = data.meta.frozenCols || 0;

        // Calculate sticky offsets
        let rowHeights = 35; // Default row height estimation
        let colWidths = 120; // Default column width estimation

        data.rows.forEach((row, rIndex) => {
          const tr = document.createElement('tr');

          row.forEach((cell, cIndex) => {
            const td = document.createElement('td');
            td.textContent = cell.value;
            
            // Apply Colors and Text Formatting from Google Sheet
            if (cell.bg) td.style.backgroundColor = cell.bg;
            if (cell.color) td.style.color = cell.color;
            if (cell.bold) td.style.fontWeight = 'bold';

            // Apply Frozen Row Logic
            if (rIndex < frozenRows) {
              td.classList.add('freeze-row');
              td.style.top = `${rIndex * 35}px`;
            }

            // Apply Frozen Column Logic
            if (cIndex < frozenCols) {
              td.classList.add('freeze-col');
              td.style.left = `${cIndex * 120}px`;
            }

            tr.appendChild(td);
          });

          table.appendChild(tr);
        });
      } catch (err) {
        console.error('Error loading dashboard data:', err);
      }
    }

    loadDashboard();
  </script>
</body>
</html>
