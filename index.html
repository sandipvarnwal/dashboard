<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Operations Dashboard</title>
  <style>
    * { box-sizing: border-box; }
    body { 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
      margin: 10px; 
      background-color: #f4f6f8; 
      color: #333;
    }

    /* Header & Navigation */
    .header-bar { margin-bottom: 12px; }
    .header-title { font-size: 18px; font-weight: 700; color: #1a73e8; margin: 0 0 10px 0; }
    
    .tabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
    .tab-btn { 
      padding: 8px 14px; 
      cursor: pointer; 
      border: 1px solid #ccc; 
      background: #ffffff; 
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
    }
    .tab-btn.active { 
      background: #1a73e8; 
      border-color: #1a73e8; 
      color: #ffffff; 
    }

    /* Scrollable Container */
    .table-container { 
      width: 100%; 
      max-height: 80vh; 
      overflow: auto; /* Enables native horizontal & vertical scrolling */
      border: 2px solid #555; 
      border-radius: 6px;
      background: #ffffff; 
      display: none; 
      -webkit-overflow-scrolling: touch;
    }
    .table-container.active { display: block; }

    /* Explicit Grid Borders */
    table { 
      border-collapse: separate; 
      border-spacing: 0; 
      min-width: max-content; /* Prevents columns from compressing */
    }
    td, th { 
      border-right: 1px solid #888888 !important; 
      border-bottom: 1px solid #888888 !important; 
      padding: 8px 10px; 
      font-size: 12px; 
      white-space: nowrap;
    }

    /* Sticky Panes with Solid Backgrounds */
    .freeze-row { position: sticky; z-index: 10; background-color: #f1f3f4; }
    .freeze-col { position: sticky; z-index: 10; background-color: #ffffff; }
    .freeze-row.freeze-col { z-index: 20; background-color: #e8eaed; }
  </style>
</head>
<body>

  <div class="header-bar">
    <h1 class="header-title">Operations Dashboard</h1>
    <div class="tabs" id="tab-container"></div>
  </div>

  <div id="tables-wrapper"></div>

  <script>
    function cleanId(str) {
      return str.replace(/[^a-zA-Z0-9]/g, '_');
    }

    function switchTab(cleanSheetId) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.table-container').forEach(tc => tc.classList.remove('active'));
      
      const targetBtn = document.getElementById('btn-' + cleanSheetId);
      const targetContainer = document.getElementById('container-' + cleanSheetId);
      
      if (targetBtn) targetBtn.classList.add('active');
      if (targetContainer) targetContainer.classList.add('active');
    }

    async function loadDashboard() {
      try {
        const response = await fetch('./data.json?t=' + new Date().getTime());
        const allData = await response.json();
        
        const tabContainer = document.getElementById('tab-container');
        const tablesWrapper = document.getElementById('tables-wrapper');
        tabContainer.innerHTML = '';
        tablesWrapper.innerHTML = '';

        let isFirst = true;

        for (const [sheetName, data] of Object.entries(allData)) {
          const safeId = cleanId(sheetName);

          const btn = document.createElement('button');
          btn.className = 'tab-btn' + (isFirst ? ' active' : '');
          btn.id = 'btn-' + safeId;
          btn.textContent = sheetName;
          btn.onclick = () => switchTab(safeId);
          tabContainer.appendChild(btn);

          const container = document.createElement('div');
          container.className = 'table-container' + (isFirst ? ' active' : '');
          container.id = 'container-' + safeId;
          
          const table = document.createElement('table');
          const frozenRows = (data && data.meta && data.meta.frozenRows) ? data.meta.frozenRows : 0;
          const frozenCols = (data && data.meta && data.meta.frozenCols) ? data.meta.frozenCols : 0;

          if (data && data.rows) {
            data.rows.forEach((row, rIndex) => {
              const tr = document.createElement('tr');
              row.forEach((cell, cIndex) => {
                const td = document.createElement('td');
                td.textContent = cell.value;

                if (cell.bg && cell.bg !== '#ffffff') td.style.backgroundColor = cell.bg;
                if (cell.color && cell.color !== '#000000') td.style.color = cell.color;
                if (cell.bold) td.style.fontWeight = 'bold';

                // Handle dynamic freeze pane offsets
                if (rIndex < frozenRows) { 
                  td.classList.add('freeze-row'); 
                  td.style.top = `${rIndex * 33}px`; 
                }
                if (cIndex < frozenCols) { 
                  td.classList.add('freeze-col'); 
                  td.style.left = `${cIndex * 100}px`; 
                }
                tr.appendChild(td);
              });
              table.appendChild(tr);
            });
          }
          
          container.appendChild(table);
          tablesWrapper.appendChild(container);
          isFirst = false;
        }
      } catch (err) {
        console.error('Error loading dashboard data:', err);
      }
    }

    loadDashboard();
  </script>
</body>
</html>
