<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; background-color: #f8f9fa; }
    .tabs { margin-bottom: 15px; display: flex; gap: 8px; flex-wrap: wrap; }
    .tab-btn { 
      padding: 10px 18px; 
      cursor: pointer; 
      border: 1px solid #ccc; 
      background: #e9ecef; 
      border-radius: 6px 6px 0 0;
      font-weight: 500;
      transition: all 0.2s ease;
    }
    .tab-btn.active { 
      background: #ffffff; 
      border-bottom: 2px solid #007bff; 
      color: #007bff;
      font-weight: bold; 
    }
    .table-container { 
      max-width: 100%; 
      max-height: 80vh; 
      overflow: auto; 
      border: 1px solid #ccc; 
      box-shadow: 0 4px 6px rgba(0,0,0,0.1); 
      background: white; 
      display: none; 
    }
    .table-container.active { display: block; }
    table { border-collapse: separate; border-spacing: 0; width: 100%; }
    td, th { 
      border-right: 1px solid #e0e0e0; 
      border-bottom: 1px solid #e0e0e0; 
      padding: 8px 12px; 
      white-space: nowrap; 
      font-size: 13px; 
    }
    /* Dynamic Sticky Freeze Panes */
    .freeze-row { position: sticky; z-index: 2; }
    .freeze-col { position: sticky; z-index: 2; }
    .freeze-row.freeze-col { z-index: 3; }
  </style>
</head>
<body>

  <h2>Client Dashboard</h2>
  <div class="tabs" id="tab-container"></div>
  <div id="tables-wrapper"></div>

  <script>
    function switchTab(sheetName) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.table-container').forEach(tc => tc.classList.remove('active'));
      
      const targetBtn = document.getElementById('btn-' + CSS.escape(sheetName));
      const targetContainer = document.getElementById('container-' + CSS.escape(sheetName));
      
      if (targetBtn) targetBtn.classList.add('active');
      if (targetContainer) targetContainer.classList.add('active');
    }

    async function loadDashboard() {
      try {
        // Cache-busting URL parameter forces fresh data load
        const response = await fetch('./data.json?v=' + new Date().getTime());
        const allData = await response.json();
        
        const tabContainer = document.getElementById('tab-container');
        const tablesWrapper = document.getElementById('tables-wrapper');
        tabContainer.innerHTML = '';
        tablesWrapper.innerHTML = '';

        let isFirst = true;

        for (const [sheetName, data] of Object.entries(allData)) {
          // 1. Create Tab Button
          const btn = document.createElement('button');
          btn.className = 'tab-btn' + (isFirst ? ' active' : '');
          btn.id = 'btn-' + sheetName;
          btn.textContent = sheetName;
          btn.onclick = () => switchTab(sheetName);
          tabContainer.appendChild(btn);

          // 2. Create Table Container
          const container = document.createElement('div');
          container.className = 'table-container' + (isFirst ? ' active' : '');
          container.id = 'container-' + sheetName;
          
          const table = document.createElement('table');
          const frozenRows = (data.meta && data.meta.frozenRows) || 0;
          const frozenCols = (data.meta && data.meta.frozenCols) || 0;

          if (data.rows) {
            data.rows.forEach((row, rIndex) => {
              const tr = document.createElement('tr');
              row.forEach((cell, cIndex) => {
                const td = document.createElement('td');
                td.textContent = cell.value;

                // Apply Spreadsheet Styles
                if (cell.bg) td.style.backgroundColor = cell.bg;
                if (cell.color) td.style.color = cell.color;
                if (cell.bold) td.style.fontWeight = 'bold';

                // Apply Freeze Panes
                if (rIndex < frozenRows) { 
                  td.classList.add('freeze-row'); 
                  td.style.top = `${rIndex * 33}px`; 
                }
                if (cIndex < frozenCols) { 
                  td.classList.add('freeze-col'); 
                  td.style.left = `${cIndex * 110}px`; 
                }
                tr.appendChild(td);
              });
              table.appendChild(tr);
            });
          }
          
          container.appendChild(table);
          tablesWrapper.appendChild(container);
          isFirst = false;
        }
      } catch (err) {
        console.error('Error loading dashboard data:', err);
      }
    }

    loadDashboard();
  </script>
</body>
</html>
